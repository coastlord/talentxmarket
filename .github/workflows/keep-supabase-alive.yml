name: Keep Supabase Staging Alive

on:
  schedule:
    - cron: '0 9 */4 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase staging
        run: |
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_STAGING_ANON_KEY }}" \
            "https://fajparwvugllhpinkxgx.supabase.co/rest/v1/candidates?select=id&limit=1" \
            > /dev/null && echo "Ping successful"
